<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Local PDF Editor</title>
<script src="/static/vendor/tailwindcss.js"></script>
<script src="/static/vendor/fabric.min.js"></script>
</head>
<body class="bg-slate-900 text-gray-200 min-h-screen flex flex-col items-center font-sans">

  <!-- View 1: Upload -->
  <div id="uploadView" class="w-full max-w-2xl px-4 flex-1 flex flex-col justify-center">
    <h1 class="text-3xl font-bold text-gray-100 mb-6 text-center">Local PDF Editor</h1>
    <div id="dropzone"
         class="border-4 border-dashed border-slate-700 rounded-xl bg-slate-800 p-16 text-center cursor-pointer transition-colors hover:border-blue-400">
      <p class="text-gray-400 text-lg mb-4">Drag &amp; drop a PDF here</p>
      <p class="text-gray-500 mb-4">or</p>
      <label class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg cursor-pointer">
        Choose File
        <input id="fileInput" type="file" accept="application/pdf" class="hidden" />
      </label>
    </div>
    <p id="uploadStatus" class="text-center text-sm text-gray-500 mt-4"></p>
  </div>

  <!-- View 2: Editor Workspace -->
  <div id="editorView" class="hidden w-full h-screen flex flex-col">
    <!-- Top toolbar -->
    <div class="flex flex-wrap items-center gap-4 p-3 bg-slate-800 border-b border-slate-700">
      <div class="flex items-center gap-2">
        <label for="filenameInput" class="text-sm font-medium text-gray-300">File name:</label>
        <input id="filenameInput" type="text" value="edited_document.pdf"
               class="bg-slate-900 text-white border border-slate-700 rounded-md px-3 py-1.5 text-sm w-56 focus:outline-none focus:ring-2 focus:ring-blue-400" />
      </div>
      <button id="exportBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-5 rounded-lg disabled:opacity-40">Export &amp; Download PDF</button>
      <div class="flex items-center gap-2 ml-auto">
        <button id="prevBtn" class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 px-4 rounded-lg disabled:opacity-40 disabled:cursor-not-allowed">
          &larr; Previous Page
        </button>
        <span id="pageIndicator" class="text-gray-300 font-medium">Page 1 of 1</span>
        <button id="nextBtn" class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 px-4 rounded-lg disabled:opacity-40 disabled:cursor-not-allowed">
          Next Page &rarr;
        </button>
      </div>
    </div>

    <!-- Split pane -->
    <div class="flex-1 flex overflow-hidden">
      <!-- Left column: static PDF reference -->
      <div id="leftPane" class="w-3/5 h-full overflow-auto bg-slate-950 flex items-start justify-center p-4">
        <div id="canvasContainer" class="bg-white shadow-lg inline-block">
          <canvas id="referenceCanvas"></canvas>
        </div>
      </div>

      <!-- Right column: grouped form -->
      <div id="rightPane" class="w-2/5 h-full overflow-y-auto bg-slate-800 border-l border-slate-700 p-4">
        <div id="rowsContainer" class="flex flex-col gap-3"></div>
      </div>
    </div>
  </div>

<script>
  const uploadView = document.getElementById('uploadView');
  const editorView = document.getElementById('editorView');
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const uploadStatus = document.getElementById('uploadStatus');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const exportBtn = document.getElementById('exportBtn');
  const pageIndicator = document.getElementById('pageIndicator');
  const filenameInput = document.getElementById('filenameInput');
  const leftPane = document.getElementById('leftPane');
  const canvasContainer = document.getElementById('canvasContainer');
  const rowsContainer = document.getElementById('rowsContainer');

  // Number of rows chunked into a single collapsible accordion section.
  const ROWS_PER_SECTION = 4;
  // Fabric.js canvas replaces the old plain <canvas> 2D context so bounding
  // boxes stay pixel-perfectly aligned with the rendered PDF image via
  // setZoom() instead of CSS scaling.
  const fabricCanvas = new fabric.Canvas('referenceCanvas', {
    selection: false,
    hoverCursor: 'default',
  });

  let totalPages = 0;
  let currentPage = 0;
  let lastImg = null;
  let lastRows = [];
  let lastRenderedBlocks = [];
  let currentOpenSection = null;
  // Map of block id -> pending edit payload, persisted across page navigation.
  const dirtyMap = new Map();

  function setStatus(message, isError) {
    uploadStatus.textContent = message;
    uploadStatus.className = 'text-center text-sm mt-4 ' + (isError ? 'text-red-500' : 'text-gray-500');
  }

  async function uploadFile(file) {
    if (!file) return;
    if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
      setStatus('Please select a PDF file.', true);
      return;
    }

    setStatus('Uploading...', false);
    const formData = new FormData();
    formData.append('file', file);

    try {
      const response = await fetch('/upload', { method: 'POST', body: formData });
      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        throw new Error(err.detail || 'Upload failed.');
      }
      const data = await response.json();
      totalPages = data.pages;
      currentPage = 0;
      dirtyMap.clear();
      uploadView.classList.add('hidden');
      editorView.classList.remove('hidden');
      await loadPage(currentPage);
    } catch (err) {
      setStatus(err.message, true);
    }
  }

  async function loadPage(pageNumber) {
    const [renderResponse, textResponse] = await Promise.all([
      fetch(`/render/${pageNumber}`), fetch(`/text/${pageNumber}`)
    ]);
    if (!renderResponse.ok || !textResponse.ok) {
      setStatus('Failed to load page text or image.', true);
      return;
    }
    const blob = await renderResponse.blob();
    const rows = await textResponse.json();
    const url = URL.createObjectURL(blob);

    const img = new Image();
    img.onload = () => {
      currentPage = pageNumber;
      lastImg = img;
      lastRows = rows;
      lastRenderedBlocks = rows.flatMap((row) => row.blocks);
      currentOpenSection = null;
      drawReferenceCanvas(img, rows);
      buildForm(rows, pageNumber);
      URL.revokeObjectURL(url);
    };
    img.src = url;

    pageIndicator.textContent = `Page ${pageNumber + 1} of ${totalPages}`;
    prevBtn.disabled = pageNumber <= 0; nextBtn.disabled = pageNumber >= totalPages - 1;
  }

  function drawReferenceCanvas(img, rows) {
    // Fit the canvas to the left column's available width, then use
    // setZoom() (not CSS scaling) so every Fabric object -- including the
    // bounding-box rects -- stays perfectly aligned with the image pixels.
    const availableWidth = Math.max(leftPane.clientWidth - 32, 200);
    const scale = availableWidth / img.width;

    fabricCanvas.clear();
    fabricCanvas.setDimensions({ width: img.width * scale, height: img.height * scale });
    fabricCanvas.setZoom(scale);

    // Build directly from the already-loaded <img> element (not fromURL) so
    // resize redraws keep working even after the original blob: URL has
    // been revoked.
    const fabricImg = new fabric.Image(img, { left: 0, top: 0, selectable: false, evented: false });
    fabricCanvas.setBackgroundImage(fabricImg, fabricCanvas.renderAll.bind(fabricCanvas));

    // Draw one rect per text block, tagged with the accordion section it
    // belongs to so we can cross-highlight it later.
    rows.forEach((row, rowIndex) => {
      const sectionIndex = Math.floor(rowIndex / ROWS_PER_SECTION);
      row.blocks.forEach((block) => {
        const [x0, y0, x1, y1] = block.scaled_bbox;
        const rect = new fabric.Rect({
          left: x0,
          top: y0,
          width: x1 - x0,
          height: y1 - y0,
          fill: 'rgba(59, 130, 246, 0.15)',
          stroke: 'rgba(29, 78, 216, 0.6)',
          strokeWidth: 1,
          selectable: false,
          evented: false,
          objectCaching: false,
        });
        rect.blockId = block.id;
        rect.sectionIndex = sectionIndex;
        fabricCanvas.add(rect);
      });
    });
    fabricCanvas.renderAll();
    highlightSection(currentOpenSection);
  }

  // Loop through every Fabric rect and brighten the ones belonging to
  // `sectionIndex` while dimming everything else, so the reference canvas
  // stays focused on whichever accordion section is currently expanded.
  function highlightSection(sectionIndex) {
    fabricCanvas.getObjects('rect').forEach((rect) => {
      if (sectionIndex !== null && rect.sectionIndex === sectionIndex) {
        rect.set({ fill: 'rgba(250, 204, 21, 0.45)', stroke: 'rgba(202, 138, 4, 0.9)', strokeWidth: 2 });
      } else if (sectionIndex === null) {
        rect.set({ fill: 'rgba(59, 130, 246, 0.15)', stroke: 'rgba(29, 78, 216, 0.6)', strokeWidth: 1 });
      } else {
        rect.set({ fill: 'rgba(0, 0, 0, 0)', stroke: 'rgba(156, 163, 175, 0.3)', strokeWidth: 1 });
      }
    });
    fabricCanvas.renderAll();
  }

  function buildForm(rows, pageNumber) {
    rowsContainer.innerHTML = '';
    currentOpenSection = null;

    for (let i = 0; i < rows.length; i += ROWS_PER_SECTION) {
      const sectionIndex = i / ROWS_PER_SECTION;
      const sectionRows = rows.slice(i, i + ROWS_PER_SECTION);

      const section = document.createElement('details');
      section.className = 'bg-slate-800 rounded-lg shadow-sm border border-slate-700 overflow-hidden';
      section.dataset.sectionIndex = sectionIndex;

      const summary = document.createElement('summary');
      summary.className = 'bg-slate-700 hover:bg-slate-600 text-slate-100 text-sm font-semibold px-3 py-2 cursor-pointer select-none';
      summary.textContent = `Section ${sectionIndex + 1}`;
      section.appendChild(summary);

      const sectionBody = document.createElement('div');
      sectionBody.className = 'flex flex-col gap-3 p-3';

      sectionRows.forEach((row) => {
        const rowWrap = document.createElement('div');
        rowWrap.className = 'flex flex-col gap-2 pb-2 border-b border-slate-700 last:border-b-0 last:pb-0';

        const rowLabel = document.createElement('div');
        rowLabel.className = 'text-xs font-semibold uppercase tracking-wide text-slate-400';
        rowLabel.textContent = `Row ${row.row_index}`;
        rowWrap.appendChild(rowLabel);

        row.blocks.forEach((block) => {
          const fieldWrap = document.createElement('div');
          fieldWrap.className = 'flex flex-col gap-1';

          const originalLabel = document.createElement('label');
          originalLabel.className = 'text-[11px] text-slate-400';
          originalLabel.textContent = 'Original Text';
          fieldWrap.appendChild(originalLabel);

          const field = document.createElement('textarea');
          field.rows = 1;
          field.value = block.text;
          field.className = 'w-full bg-slate-900 text-slate-100 border border-slate-700 rounded-md px-2 py-1.5 text-sm font-mono resize-y focus:outline-none focus:ring-2 focus:ring-blue-400';
          field.dataset.id = block.id;
          field.dataset.originalText = block.text;
          field.dataset.originalBbox = JSON.stringify(block.original_bbox);
          field.dataset.fontSize = block.font_size;
          field.dataset.isOcr = block.is_ocr ? '1' : '0';
          field.dataset.originalFont = block.original_font || 'helv';
          field.dataset.originalColor = JSON.stringify(block.original_color || [0, 0, 0]);
          field.dataset.pageNumber = pageNumber;

          field.addEventListener('input', () => {
            const id = field.dataset.id;
            if (field.value !== field.dataset.originalText) {
              dirtyMap.set(id, {
                page_number: parseInt(field.dataset.pageNumber, 10),
                original_bbox: JSON.parse(field.dataset.originalBbox),
                new_text: field.value,
                font_size: parseFloat(field.dataset.fontSize),
                is_ocr: field.dataset.isOcr === '1',
                original_font: field.dataset.originalFont,
                original_color: JSON.parse(field.dataset.originalColor),
              });
            } else {
              dirtyMap.delete(id);
            }
          });

          fieldWrap.appendChild(field);
          rowWrap.appendChild(fieldWrap);
        });

        sectionBody.appendChild(rowWrap);
      });

      section.appendChild(sectionBody);

      // Exclusive accordion: opening a section closes the others and
      // brightens only that section's bounding boxes on the left canvas.
      section.addEventListener('toggle', () => {
        if (section.open) {
          rowsContainer.querySelectorAll('details').forEach((other) => {
            if (other !== section) other.open = false;
          });
          currentOpenSection = sectionIndex;
          highlightSection(sectionIndex);
        } else if (currentOpenSection === sectionIndex) {
          currentOpenSection = null;
          highlightSection(null);
        }
      });

      rowsContainer.appendChild(section);
    }
  }

  let resizeTimeout;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => { if (lastImg) drawReferenceCanvas(lastImg, lastRows); }, 150);
  });

  exportBtn.addEventListener('click', async () => {
    exportBtn.disabled = true;
    try {
      const payload = {
        custom_filename: filenameInput.value.trim() || 'edited_document.pdf',
        edits: Array.from(dirtyMap.values()),
      };
      const response = await fetch('/export', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!response.ok) throw new Error('Export failed.');
      const url = URL.createObjectURL(await response.blob());
      const link = document.createElement('a');
      link.href = url;
      link.download = payload.custom_filename;
      link.click();
      URL.revokeObjectURL(url);
    } catch (err) {
      setStatus(err.message, true);
    } finally {
      exportBtn.disabled = false;
    }
  });

  // Drag & drop handlers
  dropzone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropzone.classList.add('border-blue-400');
  });
  dropzone.addEventListener('dragleave', () => {
    dropzone.classList.remove('border-blue-400');
  });
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('border-blue-400');
    const file = e.dataTransfer.files[0];
    uploadFile(file);
  });

  fileInput.addEventListener('change', (e) => {
    uploadFile(e.target.files[0]);
  });

  prevBtn.addEventListener('click', () => {
    if (currentPage > 0) {
      loadPage(currentPage - 1);
    }
  });

  nextBtn.addEventListener('click', () => {
    if (currentPage < totalPages - 1) {
      loadPage(currentPage + 1);
    }
  });
</script>
</body>
</html>
